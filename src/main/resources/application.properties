spring.application.name=sync

spring.datasource.url=${spring_datasource_url:jdbc:postgresql://localhost:5432/dev}
spring.datasource.username=${spring_datasource_username:dev}
spring.datasource.password=${spring_datasource_password:dev}
spring.datasource.driver-class-name=${spring_datasource_driver-class-name:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
